{# reset_step1.html #}
{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-md py-20">
  <h1 class="mb-6 text-2xl font-semibold">Reset your password</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="w-full rounded-lg bg-neutral-900 px-4 py-2.5 text-white dark:bg-white dark:text-neutral-900">
      Verify
    </button>
  </form>
</div>
{% endblock %}
