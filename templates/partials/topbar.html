{# Top bar — glass, theme toggle, live pulse #}
<header class="sticky top-0 z-20 mx-3 mt-3 flex h-14 items-center justify-between
               rounded-2xl ves-glass px-4 md:mx-4 md:px-6">

  <button id="sidebar-toggle" class="rounded-xl p-2 hover:bg-black/5 dark:hover:bg-white/5 md:hidden" aria-label="Open menu">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <a href="{% url 'dashboard:home' %}" class="hidden items-center gap-2 md:flex">
    {% include "partials/logo.html" with size=22 %}
    <span class="ves-wordmark text-sm">Vespera</span>
  </a>

  <div class="flex items-center gap-2">
    {# live pulse dot — signals "app is alive"; later wired to real streak data #}
    <span class="ves-pulse" aria-hidden="true"></span>
    <span class="hidden text-xs text-[var(--ves-muted)] sm:inline">Live</span>
  </div>

  <div class="flex items-center gap-1.5">
    <button id="theme-toggle" class="rounded-xl p-2 hover:bg-black/5 dark:hover:bg-white/5" aria-label="Toggle theme">
      {# sun shown in dark mode, moon shown in light #}
      <svg class="hidden dark:block" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="block dark:hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
    </button>

    <span class="hidden text-sm text-[var(--ves-muted)] sm:inline">{{ user.username }}</span>
    <a href="{% url 'accounts:logout' %}" class="rounded-xl px-3 py-1.5 text-sm hover:bg-black/5 dark:hover:bg-white/5">Logout</a>
  </div>
</header>
